<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Step 3: Review password and save settings</title>
  <desc id="desc">The lower part of a settings dialog shows a masked password, password actions, and the Save button.</desc>
  <rect width="900" height="500" rx="20" fill="#0d1117"/>
  <rect x="45" y="20" width="810" height="460" rx="18" fill="#171c24" stroke="#353d48" stroke-width="2"/>
  <text x="82" y="71" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="23" font-weight="700">Password</text>
  <text x="82" y="107" fill="#aab2be" font-family="Arial, sans-serif" font-size="15">Saved password: ••••••••</text>
  <rect x="70" y="132" width="760" height="152" rx="12" fill="#1b2028" stroke="#343c47"/>
  <circle cx="103" cy="169" r="9" fill="none" stroke="#9bf00b" stroke-width="2"/>
  <circle cx="103" cy="169" r="5" fill="#9bf00b"/>
  <text x="126" y="175" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="16">Keep current password</text>
  <circle cx="103" cy="213" r="9" fill="none" stroke="#aab2be" stroke-width="2"/>
  <text x="126" y="219" fill="#d5dae1" font-family="Arial, sans-serif" font-size="16">Use another saved password</text>
  <circle cx="103" cy="257" r="9" fill="none" stroke="#aab2be" stroke-width="2"/>
  <text x="126" y="263" fill="#d5dae1" font-family="Arial, sans-serif" font-size="16">Replace password</text>
  <text x="82" y="324" fill="#aab2be" font-family="Arial, sans-serif" font-size="15">Scroll to the bottom when you are ready.</text>
  <path d="M817 315v54m0 0-9-10m9 10 9-10" fill="none" stroke="#9bf00b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 386h764" stroke="#353d48" stroke-width="2"/>
  <rect x="580" y="407" width="115" height="51" rx="9" fill="#272e38" stroke="#424b57"/>
  <text x="637" y="439" text-anchor="middle" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="16">Cancel</text>
  <rect x="710" y="407" width="120" height="51" rx="9" fill="#9bf00b"/>
  <text x="770" y="439" text-anchor="middle" fill="#142000" font-family="Arial, sans-serif" font-size="16" font-weight="700">Save</text>
  <text x="82" y="444" fill="#7f8996" font-family="Arial, sans-serif" font-size="13">Sample only • never shown as plain text</text>
</svg>
