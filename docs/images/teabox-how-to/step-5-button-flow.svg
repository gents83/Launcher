<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">How a project button becomes an action</title>
  <desc id="desc">Refresh loads a button definition as a dashboard tile. Clicking the tile starts the configured program. Playlist files create separate TeaBox tiles.</desc>
  <rect width="960" height="560" rx="20" fill="#0d1117"/>
  <text x="46" y="53" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="25" font-weight="700">Set it up • Refresh • Click to run</text>
  <rect x="36" y="88" width="310" height="265" rx="16" fill="#171c24" stroke="#424b57" stroke-width="2"/>
  <text x="60" y="126" fill="#9bf00b" font-family="Arial, sans-serif" font-size="15" font-weight="700">PROJECT JSON</text>
  <text x="60" y="166" fill="#f3f4f1" font-family="Consolas, monospace" font-size="15">Buttons: [</text>
  <text x="78" y="198" fill="#d5dae1" font-family="Consolas, monospace" font-size="14">Id: open-tool</text>
  <text x="78" y="228" fill="#d5dae1" font-family="Consolas, monospace" font-size="14">Label: Open Tool</text>
  <text x="78" y="258" fill="#d5dae1" font-family="Consolas, monospace" font-size="14">Executable: MyTool.exe</text>
  <text x="60" y="301" fill="#f3f4f1" font-family="Consolas, monospace" font-size="15">]</text>
  <text x="191" y="338" fill="#7f8996" font-family="Arial, sans-serif" font-size="12">Example only</text>
  <path d="M360 221h53m0 0-12-12m12 12-12 12" fill="none" stroke="#9bf00b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="426" y="88" width="210" height="265" rx="16" fill="#171c24" stroke="#424b57" stroke-width="2"/>
  <text x="531" y="126" text-anchor="middle" fill="#9bf00b" font-family="Arial, sans-serif" font-size="15" font-weight="700">AFTER REFRESH</text>
  <rect x="452" y="166" width="158" height="132" rx="12" fill="#202731" stroke="#657180"/>
  <rect x="474" y="184" width="42" height="42" rx="9" fill="#9bf00b"/>
  <text x="495" y="212" text-anchor="middle" fill="#142000" font-family="Arial, sans-serif" font-size="13" font-weight="700">APP</text>
  <text x="531" y="253" text-anchor="middle" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="17" font-weight="700">Open Tool</text>
  <text x="531" y="278" text-anchor="middle" fill="#aab2be" font-family="Arial, sans-serif" font-size="13">Tools</text>
  <text x="531" y="331" text-anchor="middle" fill="#d5dae1" font-family="Arial, sans-serif" font-size="13">A tile you can click</text>
  <path d="M650 221h43m0 0-12-12m12 12-12 12" fill="none" stroke="#9bf00b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="705" y="88" width="219" height="265" rx="16" fill="#171c24" stroke="#424b57" stroke-width="2"/>
  <text x="814" y="126" text-anchor="middle" fill="#9bf00b" font-family="Arial, sans-serif" font-size="15" font-weight="700">WHEN YOU CLICK</text>
  <circle cx="814" cy="210" r="47" fill="#202731" stroke="#657180" stroke-width="2"/>
  <path d="M797 210h34m-12-12 12 12-12 12" fill="none" stroke="#9bf00b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="814" y="286" text-anchor="middle" fill="#f3f4f1" font-family="Arial, sans-serif" font-size="16" font-weight="700">MyTool.exe starts</text>
  <text x="814" y="314" text-anchor="middle" fill="#aab2be" font-family="Arial, sans-serif" font-size="13">using its launch options</text>
  <rect x="36" y="386" width="888" height="102" rx="14" fill="#171c24" stroke="#424b57"/>
  <text x="58" y="425" fill="#9bf00b" font-family="Arial, sans-serif" font-size="15" font-weight="700">TEABOX PLAYLISTS</text>
  <text x="58" y="459" fill="#d5dae1" font-family="Arial, sans-serif" font-size="15">A .playlist file makes its own TeaBox tile automatically. Do not add it to Buttons.</text>
  <text x="58" y="526" fill="#aab2be" font-family="Arial, sans-serif" font-size="14">Refresh updates the tiles. Nothing starts until you click an action.</text>
</svg>
