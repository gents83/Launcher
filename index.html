<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Project Launcher</title>
  <script>
    window.launcherToken = "__LAUNCHER_TOKEN__";
    window.launcherThemePreference = null;
    try {
      const cookieTheme = document.cookie.match(/(?:^|;\s*)launcher-theme=(dark|light)(?:;|$)/);
      if (cookieTheme) window.launcherThemePreference = cookieTheme[1];
    } catch {}
    if (!window.launcherThemePreference) {
      try {
        const savedTheme = window.localStorage.getItem('launcher-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') window.launcherThemePreference = savedTheme;
      } catch {}
    }
    if (window.launcherThemePreference) {
      document.documentElement.dataset.theme = window.launcherThemePreference;
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f4f1;
      --muted: #a6acb4;
      --canvas: #090b10;
      --panel: rgb(23 26 33 / 90%);
      --tile: rgb(26 30 38 / 92%);
      --rule: rgb(255 255 255 / 11%);
      --xbox-green: #9bf00b;
      --xbox-glow: rgb(155 240 11 / 22%);
      --error: #ff938b;
      --success: #9bf00b;
      --page-background: radial-gradient(ellipse at 74% 2%, #20252d 0, transparent 40%), var(--canvas);
      --backdrop-scrim: linear-gradient(90deg, rgb(8 10 14 / 86%) 0%, rgb(8 10 14 / 52%) 52%, rgb(8 10 14 / 72%) 100%), linear-gradient(180deg, rgb(8 10 14 / 30%) 0%, rgb(8 10 14 / 48%) 42%, #090b10 100%);
      --brand-ink: #10140b;
      --badge-background: rgb(15 18 23 / 72%);
      --workspace-background: linear-gradient(110deg, rgb(24 28 35 / 94%), rgb(16 19 25 / 83%));
      --workspace-shadow: 0 18px 45px rgb(0 0 0 / 24%);
      --field-background: #171b22;
      --tile-background: linear-gradient(145deg, rgb(30 34 42 / 96%), rgb(18 21 28 / 94%));
      --tile-shadow: 0 9px 24px rgb(0 0 0 / 20%);
      --tile-hover-background: linear-gradient(145deg, rgb(35 42 44 / 98%), rgb(21 27 29 / 97%));
      --tile-hover-border: rgb(155 240 11 / 68%);
      --tile-hover-shadow: 0 12px 30px rgb(0 0 0 / 32%), 0 0 22px rgb(155 240 11 / 8%);
      --art-border: rgb(255 255 255 / 13%);
      --index-border: rgb(155 240 11 / 24%);
      --index-background: linear-gradient(145deg, rgb(155 240 11 / 15%), rgb(155 240 11 / 5%));
      --empty-background: rgb(20 23 29 / 78%);
      --empty-border: rgb(255 255 255 / 22%);
      --dialog-background: #171b22;
      --dialog-shadow: 0 28px 90px rgb(0 0 0 / 55%);
      --dialog-scrim: rgb(4 6 10 / 78%);
      --close-background: #242a32;
      --footer-ink: #7e858e;
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      background: var(--canvas);
      color: var(--ink);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --ink: #1d252b;
      --muted: #58636d;
      --canvas: #f4f6f8;
      --panel: rgb(255 255 255 / 92%);
      --tile: rgb(255 255 255 / 95%);
      --rule: rgb(20 31 42 / 14%);
      --xbox-green: #107c10;
      --xbox-glow: rgb(16 124 16 / 15%);
      --error: #b42318;
      --success: #107c10;
      --page-background: radial-gradient(ellipse at 74% 2%, #e5edf2 0, transparent 42%), var(--canvas);
      --backdrop-scrim: linear-gradient(90deg, rgb(245 248 250 / 94%) 0%, rgb(245 248 250 / 70%) 52%, rgb(245 248 250 / 84%) 100%), linear-gradient(180deg, rgb(245 248 250 / 22%) 0%, rgb(245 248 250 / 48%) 42%, #f4f6f8 100%);
      --brand-ink: #fff;
      --badge-background: rgb(255 255 255 / 82%);
      --workspace-background: linear-gradient(110deg, rgb(255 255 255 / 96%), rgb(247 249 250 / 93%));
      --workspace-shadow: 0 18px 45px rgb(24 40 52 / 10%);
      --field-background: #fff;
      --tile-background: linear-gradient(145deg, #fff, #f4f7f8);
      --tile-shadow: 0 9px 24px rgb(24 40 52 / 9%);
      --tile-hover-background: linear-gradient(145deg, #fff, #eff7ef);
      --tile-hover-border: rgb(16 124 16 / 62%);
      --tile-hover-shadow: 0 12px 30px rgb(24 40 52 / 13%), 0 0 22px rgb(16 124 16 / 9%);
      --art-border: rgb(20 31 42 / 13%);
      --index-border: rgb(16 124 16 / 25%);
      --index-background: linear-gradient(145deg, rgb(16 124 16 / 12%), rgb(16 124 16 / 4%));
      --empty-background: rgb(255 255 255 / 88%);
      --empty-border: rgb(20 31 42 / 24%);
      --dialog-background: #fff;
      --dialog-shadow: 0 28px 90px rgb(24 40 52 / 25%);
      --dialog-scrim: rgb(24 35 44 / 38%);
      --close-background: #edf1f4;
      --footer-ink: #68737d;
    }

    * { box-sizing: border-box; }
    body { position: relative; isolation: isolate; margin: 0; min-width: 320px; min-height: 100vh; background: var(--page-background); }
    button, select { font: inherit; }
    .backdrop { position: fixed; z-index: 0; inset: 0; overflow: hidden; background: var(--canvas); pointer-events: none; }
    .backdrop img { width: 100%; height: 100%; object-fit: cover; opacity: .34; filter: saturate(.82); }
    .backdrop::after { position: absolute; inset: 0; background: var(--backdrop-scrim); content: ""; }
    .shell { position: relative; z-index: 1; width: min(100%, 1360px); margin: 0 auto; padding: 34px 40px 54px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 15px; }
    .brand-mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; background: var(--xbox-green); box-shadow: 0 0 28px var(--xbox-glow); color: var(--brand-ink); font: 800 14px "Cascadia Code", Consolas, monospace; letter-spacing: -1px; }
    .eyebrow { margin: 0; color: var(--xbox-green); font: 700 10px "Cascadia Code", Consolas, monospace; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font: 650 clamp(25px, 3.5vw, 36px) "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: -.035em; }
    .header-controls { display: flex; align-items: center; gap: 10px; }
    .theme-toggle { min-height: 36px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--badge-background); color: var(--ink); font: 600 10px "Cascadia Code", Consolas, monospace; cursor: pointer; }
    .theme-toggle:hover { border-color: var(--xbox-green); }
    .local-mark { display: inline-flex; align-items: center; gap: 9px; padding: 9px 13px; border: 1px solid var(--rule); border-radius: 999px; background: var(--badge-background); color: var(--ink); font: 600 10px "Cascadia Code", Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .local-mark::before { width: 7px; height: 7px; border-radius: 50%; background: var(--xbox-green); box-shadow: 0 0 10px var(--xbox-green); content: ""; }

    .workspace { display: grid; grid-template-columns: minmax(240px, 1fr) auto; align-items: end; gap: 28px; margin: 20px 0 42px; padding: 25px 28px; border: 1px solid var(--rule); border-left: 3px solid var(--xbox-green); border-radius: 18px; background: var(--workspace-background); box-shadow: var(--workspace-shadow); backdrop-filter: blur(18px); }
    .field { display: grid; gap: 10px; }
    .field label, .count-label { color: var(--muted); font: 700 10px "Cascadia Code", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    select { width: min(100%, 520px); min-height: 50px; padding: 0 42px 0 16px; border: 1px solid var(--rule); border-radius: 11px; background: var(--field-background); color: var(--ink); }
    select:focus-visible, button:focus-visible { outline: 2px solid var(--xbox-green); outline-offset: 3px; }
    .field-help { color: var(--muted); font-size: 12px; }
    .count { display: grid; justify-items: end; gap: 6px; min-width: 150px; }
    .count strong { color: var(--xbox-green); font: 600 32px "Cascadia Code", Consolas, monospace; line-height: 1; }

    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h2 { margin: 0; font: 650 clamp(21px, 2.4vw, 29px) "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: -.025em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .action-groups { display: grid; gap: 28px; }
    .action-group { min-width: 0; }
    .action-group-heading { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; font: 650 17px "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: -.01em; }
    .action-group-heading::after { flex: 1; border-top: 1px solid var(--rule); content: ""; }
    .playlist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 13px; }
    .playlist-button { position: relative; display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 16px; min-height: 116px; padding: 17px 18px; overflow: hidden; border: 1px solid var(--rule); border-radius: 16px; background: var(--tile-background); box-shadow: var(--tile-shadow); color: var(--ink); text-align: left; cursor: pointer; transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease; }
    .playlist-button::before { position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: transparent; content: ""; transition: background-color 160ms ease; }
    .playlist-button:hover, .playlist-button:focus-visible { transform: translateY(-2px); border-color: var(--tile-hover-border); background: var(--tile-hover-background); box-shadow: var(--tile-hover-shadow); }
    .playlist-button:hover::before, .playlist-button:focus-visible::before { background: var(--xbox-green); }
    .playlist-visual { position: relative; display: grid; place-items: center; width: 62px; height: 62px; }
    .playlist-art { width: 100%; height: 100%; border: 1px solid var(--art-border); border-radius: 14px; object-fit: cover; }
    .playlist-art[hidden], .playlist-index[hidden], #project-backdrop[hidden] { display: none; }
    .playlist-index { display: grid; place-items: center; width: 100%; height: 100%; border: 1px solid var(--index-border); border-radius: 14px; background: var(--index-background); color: var(--xbox-green); font: 700 16px "Cascadia Code", Consolas, monospace; }
    .playlist-detail { min-width: 0; }
    .playlist-name { display: block; overflow-wrap: anywhere; font-size: 15px; font-weight: 650; line-height: 1.35; }
    .playlist-kind { display: block; margin-top: 6px; color: var(--muted); font: 600 9px "Cascadia Code", Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .notice { min-height: 22px; margin: 20px 0 0; color: var(--muted); font-size: 13px; }
    .notice[data-kind="error"] { color: var(--error); }
    .empty { grid-column: 1 / -1; padding: 24px; border: 1px dashed var(--empty-border); border-radius: 14px; background: var(--empty-background); color: var(--muted); line-height: 1.55; }
    .empty[data-kind="error"] { border-color: var(--error); color: var(--error); }
    .playlist-button:disabled { cursor: progress; opacity: .58; transform: none; }
    .result-dialog { width: min(460px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--rule); border-radius: 18px; background: var(--dialog-background); box-shadow: var(--dialog-shadow); color: var(--ink); }
    .result-dialog::backdrop { background: var(--dialog-scrim); backdrop-filter: blur(7px); }
    .result-panel { padding: 28px; border-top: 3px solid var(--xbox-green); }
    .result-dialog[data-state="success"] .result-panel { border-color: var(--success); }
    .result-dialog[data-state="failure"] .result-panel { border-color: var(--error); }
    .result-dialog[data-state="success"] .result-title { color: var(--success); }
    .result-dialog[data-state="failure"] .result-title { color: var(--error); }
    .result-dialog[data-state="test-mode"] .result-title { color: var(--xbox-green); }
    .result-title { margin: 12px 0; font: 650 30px "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: .02em; }
    .result-message { margin: 0; color: var(--ink); line-height: 1.55; overflow-wrap: anywhere; }
    .result-close { display: block; min-width: 112px; margin: 24px 0 0 auto; padding: 11px 17px; border: 1px solid var(--rule); border-radius: 10px; background: var(--close-background); color: var(--ink); cursor: pointer; }
    .result-close:hover { border-color: var(--xbox-green); }
    .footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--footer-ink); font: 9px "Cascadia Code", Consolas, monospace; letter-spacing: .08em; }

    @media (max-width: 760px) {
      .masthead { flex-wrap: wrap; }
      .header-controls { margin-left: auto; }
      .shell { padding: 25px 20px 40px; }
      .workspace { grid-template-columns: 1fr; gap: 20px; margin: 18px 0 32px; padding: 20px; }
      .count { grid-template-columns: 1fr auto; justify-items: start; align-items: center; width: 100%; }
      .section-head { align-items: start; flex-direction: column; gap: 7px; }
      .playlist-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 430px) {
      .shell { padding: 20px 14px 34px; }
      .brand { gap: 11px; }
      .brand-mark { width: 42px; height: 42px; border-radius: 13px; }
      .eyebrow { font-size: 9px; }
      .header-controls { gap: 7px; }
      .theme-toggle { padding: 8px 9px; font-size: 9px; }
      .local-mark { padding: 8px 10px; font-size: 8px; letter-spacing: .06em; }
      .playlist-button { grid-template-columns: 50px minmax(0, 1fr); gap: 12px; min-height: 100px; padding: 14px 12px; }
      .playlist-visual { width: 50px; height: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img id="project-backdrop" alt="" hidden>
  </div>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">LA/</div>
        <div>
          <p class="eyebrow">Project / workspace control</p>
          <h1>Project actions</h1>
        </div>
      </div>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-toggle" type="button">Use light theme</button>
        <span class="local-mark">Local session</span>
      </div>
    </header>

    <main>
      <section class="workspace" aria-label="Project selection">
        <div class="field">
          <label for="project-select">Project workspace</label>
          <select id="project-select" disabled aria-describedby="project-help">
            <option>Loading projects…</option>
          </select>
          <span id="project-help" class="field-help">Choose a project to see its actions.</span>
        </div>
        <div class="count" aria-live="polite">
          <span class="count-label">Available actions</span>
          <strong id="playlist-count">—</strong>
        </div>
      </section>

      <section aria-labelledby="action-heading">
        <div class="section-head">
          <h2 id="action-heading">Project actions</h2>
          <p>Open a configured application or run a TeaBox playlist.</p>
        </div>
        <div id="action-groups" class="action-groups" aria-live="polite"></div>
        <p id="launch-status" class="notice" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer">ACTIONS ARE PROJECT-SCOPED · LAUNCH ONLY ON BUTTON CLICK</footer>
  </div>

  <dialog id="result-dialog" class="result-dialog" aria-labelledby="result-title" aria-describedby="result-message">
    <div class="result-panel">
      <p class="eyebrow">Action result</p>
      <h2 id="result-title" class="result-title">SUCCESS</h2>
      <p id="result-message" class="result-message"></p>
      <button id="result-close" class="result-close" type="button">Close</button>
    </div>
  </dialog>

  <script>
    (() => {
      const projectSelect = document.getElementById('project-select');
      const actionGroups = document.getElementById('action-groups');
      const playlistCount = document.getElementById('playlist-count');
      const launchStatus = document.getElementById('launch-status');
      const projectBackdrop = document.getElementById('project-backdrop');
      const resultDialog = document.getElementById('result-dialog');
      const resultTitle = document.getElementById('result-title');
      const resultMessage = document.getElementById('result-message');
      const resultClose = document.getElementById('result-close');
      const themeToggle = document.getElementById('theme-toggle');
      const themeTokenNames = new Set([
        'ink', 'muted', 'canvas', 'panel', 'tile', 'rule', 'xbox-green', 'xbox-glow', 'error', 'success',
        'page-background', 'backdrop-scrim', 'brand-ink', 'badge-background', 'workspace-background', 'workspace-shadow',
        'field-background', 'tile-background', 'tile-shadow', 'tile-hover-background', 'tile-hover-border', 'tile-hover-shadow',
        'art-border', 'index-border', 'index-background', 'empty-background', 'empty-border', 'dialog-background',
        'dialog-shadow', 'dialog-scrim', 'close-background', 'footer-ink'
      ]);
      let catalog = null;
      let themeColors = null;
      let currentTheme = window.launcherThemePreference || 'dark';
      let userSelectedTheme = false;

      function getSavedTheme() {
        try {
          const cookieTheme = document.cookie.match(/(?:^|;\s*)launcher-theme=(dark|light)(?:;|$)/);
          if (cookieTheme) return cookieTheme[1];
        } catch {}
        try {
          const savedTheme = window.localStorage.getItem('launcher-theme');
          return savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : null;
        } catch {
          return null;
        }
      }

      function applyTheme(theme, persist = false) {
        currentTheme = theme === 'light' ? 'light' : 'dark';
        const root = document.documentElement;
        root.dataset.theme = currentTheme;
        themeTokenNames.forEach(name => root.style.removeProperty(`--${name}`));

        const palette = themeColors && themeColors[currentTheme];
        if (palette && typeof palette === 'object') {
          Object.entries(palette).forEach(([name, value]) => {
            if (themeTokenNames.has(name) && typeof value === 'string' && value.trim()) {
              root.style.setProperty(`--${name}`, value);
            }
          });
        }

        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        themeToggle.textContent = `Use ${nextTheme} theme`;
        themeToggle.setAttribute('aria-label', `Switch to ${nextTheme} theme`);
        if (persist) {
          userSelectedTheme = true;
          try { document.cookie = `launcher-theme=${currentTheme}; Max-Age=31536000; Path=/; SameSite=Lax`; } catch {}
          try { window.localStorage.setItem('launcher-theme', currentTheme); } catch {}
        }
      }

      themeToggle.addEventListener('click', () => {
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
      });
      applyTheme(currentTheme);

      function setStatus(message, kind = '') {
        launchStatus.textContent = message;
        launchStatus.dataset.kind = kind;
      }

      projectBackdrop.addEventListener('load', () => { projectBackdrop.hidden = false; });
      projectBackdrop.addEventListener('error', () => { projectBackdrop.hidden = true; });

      function setProjectBackdrop(url) {
        projectBackdrop.hidden = true;
        if (!url) {
          projectBackdrop.removeAttribute('src');
          return;
        }
        projectBackdrop.src = url;
      }

      function showResult(state, message) {
        resultDialog.dataset.state = state.toLowerCase().replace(/\s+/g, '-');
        resultTitle.textContent = state;
        resultMessage.textContent = message;
        if (!resultDialog.open) resultDialog.showModal();
      }

      function setLaunchControlsDisabled(disabled) {
        projectSelect.disabled = disabled || !catalog || catalog.Projects.length === 0;
        actionGroups.querySelectorAll('.playlist-button').forEach(button => {
          button.disabled = disabled;
        });
      }

      resultClose.addEventListener('click', () => resultDialog.close());

      function makeEmptyMessage(message, isError = false) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        if (isError) empty.dataset.kind = 'error';
        empty.textContent = message;
        actionGroups.appendChild(empty);
      }

      function createActionButton(action, project) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'playlist-button';

        const match = action.Name.match(/^\s*(\d+)\s*-/);
        const visual = document.createElement('span');
        visual.className = 'playlist-visual';
        visual.setAttribute('aria-hidden', 'true');
        const art = document.createElement('img');
        art.className = 'playlist-art';
        art.alt = '';
        art.loading = 'eager';
        art.hidden = true;
        const index = document.createElement('span');
        index.className = 'playlist-index';
        index.textContent = action.Type === 'Application' ? 'APP' : (match ? match[1].padStart(2, '0') : '▶');
        visual.append(art, index);
        if (action.ArtworkUrl) {
          art.addEventListener('load', () => { art.hidden = false; index.hidden = true; });
          art.addEventListener('error', () => { art.hidden = true; index.hidden = false; });
          art.src = action.ArtworkUrl;
        }

        const detail = document.createElement('span');
        detail.className = 'playlist-detail';
        const name = document.createElement('span');
        name.className = 'playlist-name';
        name.textContent = action.Name;
        const kind = document.createElement('span');
        kind.className = 'playlist-kind';
        kind.textContent = action.Type === 'Application' ? 'Application' : 'TeaBox playlist';
        detail.append(name, kind);

        button.append(visual, detail);
        button.addEventListener('click', async () => {
          setLaunchControlsDisabled(true);
          const verb = action.Type === 'Application' ? 'Starting' : 'Running';
          setStatus(`${verb} ${action.Name} for ${project.Name}…`);
          try {
            const response = await fetch('/api/launch', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Launcher-Token': window.launcherToken
              },
              body: JSON.stringify({ ProjectId: project.Id, ActionId: action.Id })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.Error || 'The action could not be started.');
            if (result.TestMode) {
              showResult('TEST MODE', result.Message);
            } else if (result.Success) {
              showResult('SUCCESS', result.Message);
            } else {
              showResult('FAILURE', result.Message || 'The action did not complete successfully.');
            }
          } catch (error) {
            showResult('FAILURE', error.message);
          } finally {
            setLaunchControlsDisabled(false);
            setStatus('');
          }
        });
        return button;
      }

      function createActionGroup(title, actions, project) {
        const section = document.createElement('section');
        section.className = 'action-group';
        const heading = document.createElement('h3');
        heading.className = 'action-group-heading';
        heading.textContent = title;
        const grid = document.createElement('div');
        grid.className = 'playlist-grid';
        actions.forEach(action => grid.appendChild(createActionButton(action, project)));
        section.append(heading, grid);
        return section;
      }

      function renderSelectedProject() {
        if (!catalog) return;
        const project = catalog.Projects.find(item => item.Id === projectSelect.value);
        setProjectBackdrop(project ? project.BackgroundImageUrl : null);
        actionGroups.replaceChildren();
        setStatus('');
        if (!project) {
          playlistCount.textContent = '—';
          makeEmptyMessage('No project is selected.');
          return;
        }
        if (project.Error) {
          playlistCount.textContent = '—';
          makeEmptyMessage(project.Error, true);
          setStatus('Fix this project config or its referenced path, then reload.', 'error');
          return;
        }
        const actions = Array.isArray(project.Actions) ? project.Actions : [];
        playlistCount.textContent = String(actions.length).padStart(2, '0');
        if (actions.length === 0) {
          makeEmptyMessage(`No actions are configured for ${project.Name}. Add application buttons or enable TeaBox playlists in its project config.`);
          return;
        }
        const applicationGroups = new Map();
        const teaBoxActions = [];
        actions.forEach(action => {
          if (action.Type === 'TeaBoxPlaylist') {
            teaBoxActions.push(action);
            return;
          }
          const category = action.Category || 'Applications';
          if (!applicationGroups.has(category)) applicationGroups.set(category, []);
          applicationGroups.get(category).push(action);
        });
        applicationGroups.forEach((groupActions, category) => {
          actionGroups.appendChild(createActionGroup(category, groupActions, project));
        });
        if (teaBoxActions.length) {
          actionGroups.appendChild(createActionGroup('TeaBox playlists', teaBoxActions, project));
        }
      }

      async function loadCatalog() {
        try {
          const response = await fetch('/api/catalog', { cache: 'no-store' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.Error || 'Could not load project configuration.');
          themeColors = result.ThemeColors && typeof result.ThemeColors === 'object' ? result.ThemeColors : null;
          const savedTheme = getSavedTheme() || window.launcherThemePreference;
          const initialTheme = userSelectedTheme ? currentTheme : (savedTheme || result.Theme);
          applyTheme(initialTheme);
          catalog = result;
          projectSelect.replaceChildren();
          catalog.Projects.forEach(project => {
            const option = document.createElement('option');
            option.value = project.Id;
            option.textContent = project.Name;
            projectSelect.appendChild(option);
          });
          projectSelect.disabled = catalog.Projects.length === 0;
          projectSelect.value = catalog.DefaultProject;
          if (!projectSelect.value && catalog.Projects.length) projectSelect.selectedIndex = 0;
          projectSelect.addEventListener('change', renderSelectedProject);
          renderSelectedProject();
        } catch (error) {
          playlistCount.textContent = '—';
          makeEmptyMessage(error.message, true);
          setStatus('Check projects.json and its project-config references, then restart.', 'error');
        }
      }

      loadCatalog();
    })();
  </script>
</body>
</html>
